name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
          POSTGRES_DB: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d registry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: local
      LOG_LEVEL: info
      # IPv4: `localhost` can resolve to ::1 and miss the published port.
      DATABASE_URL: postgresql+psycopg://registry:registry@127.0.0.1:5432/registry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
