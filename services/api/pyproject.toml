[project]
name = "il-registry-api"
version = "0.1.0"
description = "Israeli baby gift registry API. No money custody, ever (D11)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.6",
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a default is how FastAPI declares a dependency, not the
# mutable-default bug B008 is looking for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `pytest` works the same as `python -m pytest`, which would otherwise be the
# only invocation that puts the service root on sys.path.
pythonpath = ["."]
